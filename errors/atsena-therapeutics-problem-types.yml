envelope:
  content_type: application/json
  shape: '{"code": "<string>", "message": "<string>", "data": {"status": <integer>}}'
  discriminator: code
  note: >-
    The WordPress REST error envelope. It is NOT RFC 9457 application/problem+json — there is no
    `type` URI, no `instance` and no `detail` member, and Atsena Therapeutics publishes no problem-type
    registry. `code` is the stable machine-readable discriminator and is what a client should branch
    on; `message` is human prose and may change. Validation failures extend `data` with a `params`
    map (parameter name to message) and a `details` map (parameter name to a nested
    {code, message, data} object).
  caution: >-
    This envelope applies only under /wp-json. Unmatched paths elsewhere on the host — /openapi.json,
    /graphql, /.well-known/security.txt — are served the site's HTML 404 page with an HTTP 404
    status. Clients must not assume a JSON body on a non-2xx response.
