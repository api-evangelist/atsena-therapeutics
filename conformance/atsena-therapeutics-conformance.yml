summary: >-
  Cross-cutting standards posture of the Atsena Therapeutics corporate web/API surface. Every
  technical standard below is inherited from WordPress, Cloudflare or WP Engine rather than authored
  by Atsena — the company runs no API programme and makes no conformance claim anywhere on its site.
  The negatives are recorded as deliberately as the positives; each carries the probe that produced
  it.
standards:
