regulatory_compliance:
  published: false
  detail: >-
    Atsena Therapeutics publishes no compliance page. Its 29 site pages were enumerated from its own
    /wp/v2/pages collection and contain no compliance, code-of-conduct, transparency or
    state-disclosure document — unlike several peers in this cohort, which publish a California
    Health and Safety Code §§119400–119402 declaration. The only governance-adjacent document on the
    site is the privacy policy. No `Compliance` pointer is emitted.
  programs: []
  security_certifications: []
  security_certifications_note: >-
    No SOC 2, ISO 27001, HIPAA, PCI DSS or FedRAMP attestation is published, and no trust centre
    exists (trust.atsenatx.com does not resolve). This is expected: the company handles clinical
    trial data under its clinical partners' governance, not through a public-facing security
    programme.
  clinical_context: >-
    Regulatory posture that IS evidenced, from the company's own press releases rather than a
    compliance page: FDA and EMA interactions on its lead programmes, including EMA orphan
    designation for ATSN-101 and ATSN-201 (2026-07-23) and a pivotal Phase 3 trial for ATSN-201.
    These are therapeutic-development regulatory milestones, not API or information-security
    conformance, and are recorded here only so the empty `programs` list above is not misread as an
    absence of regulatory engagement.
