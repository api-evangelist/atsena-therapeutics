      The provider publishes no OpenAPI. /openapi.json, /openapi.yaml, /swagger.json, /api-docs and
      /api all returned 404 on atsenatx.com, and api.atsenatx.com, docs.atsenatx.com and
      developer.atsenatx.com do not resolve. The spec in openapi/ is derived by API Evangelist from
      the live WordPress route-discovery document.
  - id: graphql
