aid: atsena-therapeutics
name: Atsena Therapeutics
description: >-
  Atsena Therapeutics is a clinical-stage gene therapy company based in Durham, North Carolina, in
  the Research Triangle, developing first- and best-in-class genetic medicines for inherited retinal
  diseases with the goal of reversing or preventing blindness. Founded by ocular gene therapy
  pioneers Shannon Boye and Sanford Boye, the company builds on two proprietary AAV delivery
  platforms: a laterally spreading AAV.SPR capsid engineered to reach retinal cells without the
  surgical trauma of a subretinal bleb, and a dual-vector technology that splits genes too large for
  a single AAV across two vectors. Its clinical pipeline includes ATSN-201 for X-linked
  retinoschisis (XLRS) in a pivotal Phase 3 trial, ATSN-101 for LCA1 (Leber congenital amaurosis 1)
  advancing to a pivotal trial with partner Nippon Shinyaku, and IND-enabling programs ATSN-301 for
  Usher syndrome 1B and ATSN-401 for Stargardt disease. Atsena runs no developer program and
  publishes no product API, no developer documentation and no specification of its own. The only
  machine-readable surface it exposes is the anonymously readable WordPress REST content API behind
  atsenatx.com, which serves the company's press releases, program and platform pages, and media
  library as JSON; the OpenAPI in this repo is derived by API Evangelist from that surface's own
  live route index.
