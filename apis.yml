x-enrichment-notes: >-
  Deliberately absent, each a verified negative probed on 2026-08-02, recorded so a later pass does
  not re-litigate them: Idempotency (no idempotency contract exists on this surface — WordPress core
  implements no idempotency key, and every modelled operation is a safe GET); SDKs and Packages
  (nothing first-party on npm, PyPI or any registry, and no GitHub organization attributable to the
  company); StatusPage and Deprecation (status.atsenatx.com NXDOMAIN, no policy, no RFC 8594 Sunset
  or Deprecation headers on any response); Security and SecurityTxt (/.well-known/security.txt 404,
  no disclosure page, no bug bounty — probe-security-programs.py returned vdp=none); TrustCenter and
  Compliance (trust.atsenatx.com NXDOMAIN, and the company's own 29-page list contains no
  compliance, certification or state-disclosure document); AgentCard (/.well-known/agent-card.json
  and /.well-known/agent.json both 404, against a host that serves a real HTML 404 rather than an
  SPA catch-all 200, so this is a true negative); MCPServer and ToolCrosswalk (no mcp namespace among
  the 12 registered, /.well-known/mcp.json 404 — note the wp-abilities/v1 registry IS installed but
  returns 401 anonymously, so no tool list is readable); AsyncAPI and Webhooks (no event, streaming
  or webhook surface of any kind); OAuthScopes (no OAuth — /.well-known/oauth-authorization-server
  and /.well-known/oauth-protected-resource both 404, so there is no scope surface to record);
  ContentSignal (robots.txt is a bare Yoast block allowing everything, with no Content Signals
  Policy, no AI-preference directives and no named AI-crawler rules — captured verbatim as evidence
  in well-known/ but not claimed as a signal); ChangeLog (no dated API changelog; the newsroom is a
  press-release feed, not release notes); RateLimits (no limit published and no rate-limit headers
  observed); TermsOfService (no terms page exists on the site); and Postman, Pricing, SignUp, Login,
  Roadmap, Documentation, DeveloperPortal, APIReference, GettingStarted, CLI, Sandbox, Components
  and GitHubOrganization, none of which the company publishes. The Support pointer is the general
  corporate contact form — there is no developer support channel.
