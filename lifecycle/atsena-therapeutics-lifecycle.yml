summary: >-
  Atsena Therapeutics is a clinical-stage gene therapy company and does not run an API programme.
  There is no developer portal, no published versioning policy, no deprecation policy, no SLA and no
  status page. What follows records the observable lifecycle posture of the one live API surface —
  the WordPress REST API behind the corporate site — and the negative results are as much the finding
  as the positive ones.
versioning:
  scheme: uri-path-namespace
  current: wp/v2
  policy_url: null
  detail: >-
    The version is carried in the namespace segment and each of the 12 registered namespaces versions
    independently: wp/v2, wp-abilities/v1, oembed/1.0, wp-site-health/v1, wp-block-editor/v1,
    yoast/v1, redirection/v1, cookieyes/v1, cky/v1, duplicate-post/v1, wpe/cache-plugin/v1 and
    wpe_sign_on_plugin/v1. No header, date or query-parameter version negotiation exists. These are
    WordPress platform conventions, not a provider-published policy.
