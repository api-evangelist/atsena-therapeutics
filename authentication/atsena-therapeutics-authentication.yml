gated_surfaces:
  - path: /wp/v2/users
    status: 401
    code: rest_user_cannot_view
    note: >-
      Author identities are not disclosed anonymously, so the `author` id on a post or page cannot be
      resolved without credentials.
  - path: /wp/v2/settings
    status: 401
    code: rest_forbidden
  - path: /wp/v2/plugins
